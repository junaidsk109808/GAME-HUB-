<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub | My Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="stylesheet" href="../CSS/profile.css">
</head>
<body>
    <aside class="sidebar collapsed" id="sidebar">
        <button class="sidebar-toggle" id="toggleSidebar">☰</button>
        <div class="sidebar-top">
            <a href="profile.html" class="profile-link">
                <div class="profile-section">
                    <div class="profile-pic"></div>
                    <div class="profile-info">
                        <p class="welcome-text">WELCOME</p>
                        <div class="username" id="display-username">PlayerOne</div>
                    </div>
                </div>
            </a>
            <nav class="nav-links">
                <a href="index.html" class="nav-item"><span>Home</span></a>
                <a href="genres.html" class="nav-item"><span>Genres</span></a>
                <a href="predict.html" class="nav-item"><span>Predict</span></a>
            </nav>
        </div>
        <button class="logout-btn" id="logoutBtn"><span>Logout</span></button>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <h1 style="font-size: 1.2rem; margin: 0; color: #fff;">My Profile</h1>
        </header>

        <div class="profile-hero">
            <div class="profile-avatar">
                <span id="avatar-initials">P</span>
            </div>
            <div class="profile-info-block">
                <h1 id="prof-username">PlayerOne</h1>
                <p class="profile-email" id="prof-email">—</p>
                <div class="profile-badges">
                    <span class="badge">🎮 Gamer</span>
                    <span class="badge" id="badge-gpu">GPU: —</span>
                    <span class="badge" id="badge-cpu">CPU: —</span>
                </div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <span class="stat-number" id="stat-games">0</span>
                <span class="stat-label">Games Saved</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="stat-liked">0</span>
                <span class="stat-label">Games Liked</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="stat-reviews">0</span>
                <span class="stat-label">Reviews</span>
            </div>
        </div>

        <div class="profile-section-card">
            <h2 class="section-title">Account <span>Settings</span></h2>
            <form id="profileForm" class="settings-form">
                <div class="form-row">
                    <div class="form-field">
                        <label>Username</label>
                        <input type="text" id="usernameInput" placeholder="New username...">
                    </div>
                    <div class="form-field">
                        <label>GPU</label>
                        <input type="text" id="gpuInput" placeholder="e.g. RTX 3060 Ti">
                    </div>
                    <div class="form-field">
                        <label>CPU</label>
                        <input type="text" id="cpuInput" placeholder="e.g. Intel Core i7">
                    </div>
                </div>
                <button type="submit" class="save-btn">Save Changes</button>
                <p id="saveStatus"></p>
            </form>
        </div>
    </main>

    <script src="../JS/sidebar.js"></script>
    <script src="../JS/profile.js"></script>
</body>
</html>
