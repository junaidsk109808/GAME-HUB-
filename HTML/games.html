<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub | Browse Games</title>
    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="stylesheet" href="../CSS/games.css"> 
</head>
<body>
    <aside class="sidebar collapsed" id="sidebar">
        <button class="sidebar-toggle" id="toggleSidebar">☰</button>
        
        <div class="sidebar-top">
            <a href="profile.htm" class="profile-link" style="text-decoration: none;">
                <div class="profile-section">
                    <div class="profile-pic"></div>
                    <div class="profile-info">
                        <p class="welcome-text">WELCOME</p>
                        <div class="username" id="display-username">PlayerOne</div>
                    </div>
                </div>
            </a>
            
            <nav class="nav-links">
                <a href="index.html" class="nav-item"><span>Home</span></a>
                <a href="genres.html" class="nav-item active"><span>Genres</span></a>
                <a href="predict.html" class="nav-item"><span>Predict</span></a>
            </nav>
        </div>
        
        <button class="logout-btn" id="logoutBtn">
            <span>Logout</span>
        </button>
    </aside>

    <main class="main-content">

        <!-- Mobile header with menu button -->
        <div class="mobile-header">
            <button class="header-menu-btn" id="menuBtn">☰</button>
            <h2 id="genre-title" class="mobile-title">Browse <span>Games</span></h2>
        </div>

        <div class="header-text desktop-only">
            <h2 id="genre-title-desktop">Browse <span>Games</span></h2>
        </div>

        <div class="games-grid" id="games-container"></div>

    </main>

    <script src="../JS/sidebar.js"></script>
    <script src="../JS/games_list.js"></script>
</body>
</html>
